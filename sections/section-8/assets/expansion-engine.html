<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRANK Expansion Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #15153a; --blue: #0b7fd4; --blue-soft: #e3f1fc; --bg: #f2f6fa; --card: #fff;
  --text: #17172b; --muted: #5d667a; --line: #dbe3ec;
  --green: #14784c; --green-soft: #e2f4ea; --amber: #94610c; --amber-soft: #fbefd5;
  --red: #b3352a; --red-soft: #fbe6e3; --grey-soft: #eceff4;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; }
a { color: var(--blue); }

.top { display: flex; align-items: center; gap: 20px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; font-size: 22px; letter-spacing: .02em; color: var(--navy); }
.brand span { color: var(--blue); }
.title { flex: 1; min-width: 0; }
.title h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.title h1 em { font-style: normal; color: var(--blue); }
.title p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.actions { display: flex; align-items: center; gap: 8px; }
.primary { background: var(--navy); color: #fff; border: 0; padding: 9px 16px; border-radius: 6px; font-weight: 600; }
.primary:hover { background: #24245c; }
.primary:disabled { opacity: .5; cursor: default; }
.ghost { background: none; border: 1px solid var(--line); padding: 8px 12px; border-radius: 6px; color: var(--text); }
.ghost:hover { border-color: var(--blue); color: var(--blue); }

.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.grey { background: var(--grey-soft); color: var(--muted); }
.pill.blue { background: var(--blue-soft); color: #075a99; }
.pill.navy { background: var(--navy); color: #fff; }

.funnel { display: flex; gap: 6px; padding: 12px 20px; align-items: stretch; }
.stage { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--line); border-radius: 6px; padding: 8px 10px; transition: border-color .3s, opacity .3s; opacity: .45; }
.stage.done, .stage.active { opacity: 1; border-top-color: var(--blue); }
.stage.active { box-shadow: 0 0 0 2px var(--blue-soft); }
.stage.sim.done { border-top-color: var(--navy); }
.stage .who { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage.sim .who { color: var(--navy); }
.stage .n { font-size: 24px; font-weight: 750; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stage .what { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.divider { display: flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); text-transform: uppercase; padding: 0 2px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(380px, 40%) 1fr; gap: 12px; padding: 0 20px 16px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; flex: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; color: var(--muted); font-weight: 600; }
.tabs button.on { color: var(--navy); border-bottom-color: var(--blue); }
.body { flex: 1; overflow: auto; min-height: 0; }
.empty { padding: 60px 30px; color: var(--muted); text-align: center; }

table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; background: #f8fafc; text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); }
td { padding: 7px 10px; border-bottom: 1px solid #edf1f5; vertical-align: middle; }
tr.row { cursor: pointer; }
tr.row:hover { background: #f6faff; }
tr.row.sel { background: var(--blue-soft); }
td.score { font-weight: 700; font-variant-numeric: tabular-nums; width: 44px; }
td .sub { color: var(--muted); font-size: 12px; }

.log { padding: 12px 14px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.log div { padding: 4px 0; border-bottom: 1px dashed #e6ebf1; }
.log b { color: var(--blue); }
.log .t { color: var(--muted); }

.cards { padding: 14px; display: grid; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card h3 { margin: 0 0 6px; font-size: 14px; }
.card p { margin: 4px 0; }
.card.key { border-left: 4px solid var(--blue); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eco { display: grid; grid-template-columns: 1fr 90px; gap: 6px 10px; align-items: center; margin-top: 8px; }
.eco input { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; font: inherit; text-align: right; }
.eco-out { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.eco-out div { background: #f6f9fc; border-radius: 6px; padding: 8px 10px; }
.eco-out b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.eco-out .agent { background: var(--blue-soft); }

.dhead { padding: 14px 18px 0; flex: none; }
.dhead h2 { margin: 0; font-size: 18px; }
.dhead .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.dbody { padding: 14px 18px 18px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
ul.plain { margin: 0; padding: 0; list-style: none; }
ul.plain li { padding: 5px 0 5px 20px; position: relative; border-bottom: 1px solid #f0f3f7; }
ul.plain li::before { content: "•"; position: absolute; left: 6px; color: var(--blue); font-weight: 700; }
ul.checks li::before { content: "✓"; color: var(--green); }
ul.checks li.bad::before { content: "✕"; color: var(--red); }
ul.checks .ev { display: block; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: var(--grey-soft); border-radius: 4px; padding: 2px 7px; font-size: 12px; }

.email { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.email .hd { background: #f8fafc; padding: 8px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.email .hd b { display: inline-block; width: 58px; color: var(--muted); font-weight: 500; }
.email .bd { padding: 12px; white-space: pre-wrap; }
.email .ft { padding: 8px 12px; font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--line); }

.simnote { background: var(--amber-soft); color: var(--amber); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; margin-bottom: 12px; }
.thread { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 82%; padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; }
.msg .from { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 2px; opacity: .75; }
.msg.frank { background: #f1f5fa; align-self: flex-start; border-bottom-left-radius: 2px; }
.msg.prospect { background: var(--navy); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
.msg .kb { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
.msg.sys { align-self: center; background: none; color: var(--muted); font-size: 12px; padding: 0; text-align: center; max-width: 100%; }
.block { align-self: stretch; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: #fff; }
.block h3 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.block table td, .block table th { padding: 5px 8px; font-size: 13px; }
.block th { position: static; }
.steps li { opacity: .35; transition: opacity .3s; }
.steps li.on { opacity: 1; }
.steps li.on::before { content: "✓"; color: var(--green); }
.replybar { position: sticky; bottom: 0; background: linear-gradient(transparent, #fff 18%); padding: 16px 0 0; margin-top: 12px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.quick button { background: #fff; border: 1px solid var(--blue); color: #075a99; border-radius: 99px; padding: 5px 11px; font-size: 12.5px; }
.quick button:hover { background: var(--blue-soft); }
.quick button.go { background: var(--blue); color: #fff; font-weight: 600; }
.inputrow { display: flex; gap: 6px; }
.inputrow input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
.inputrow input:focus { outline: 2px solid var(--blue-soft); border-color: var(--blue); }
.big { font-size: 22px; font-weight: 750; }
.row2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.row2 input[type=number] { width: 90px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
.success { border-color: var(--green); background: var(--green-soft); }
.quotefrom { background: #f8fafc; border-left: 3px solid var(--line); padding: 8px 10px; font-size: 13px; white-space: pre-wrap; border-radius: 0 6px 6px 0; }

@media (max-width: 1100px) {
  .funnel { flex-wrap: wrap; } .stage { flex: 1 1 28%; } .divider { display: none; }
  main { grid-template-columns: 1fr; overflow: auto; } body { height: auto; } .panel { min-height: 480px; }
  .cols { grid-template-columns: 1fr; }
}

/* ---- Question 1 additions ---- */
.bar { height: 6px; background: var(--grey-soft); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--blue); }
.bar i.over { background: var(--amber); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.filters { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.filters button { background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.filters button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.kpi { background: #f6f9fc; border-radius: 6px; padding: 8px 10px; }
.kpi b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11.5px; color: var(--muted); }
.spark { display: flex; align-items: flex-end; gap: 6px; height: 110px; position: relative; padding-top: 6px; border-bottom: 1px solid var(--line); }
.spark .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.spark .col i { width: 100%; background: var(--blue); border-radius: 3px 3px 0 0; display: block; }
.spark .col i.over { background: var(--amber); }
.spark .limit { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--red); }
.spark .limit span { position: absolute; right: 0; top: -17px; font-size: 11px; color: var(--red); background: #fff; padding-left: 4px; }
.sparklabels { display: flex; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 3px; }
.sparklabels span { flex: 1; text-align: center; }
.feat { display: flex; flex-wrap: wrap; gap: 5px; }
.feat span { border-radius: 4px; padding: 2px 8px; font-size: 12px; background: var(--green-soft); color: var(--green); }
.feat span.off { background: var(--grey-soft); color: var(--muted); text-decoration: line-through; }
.feat span.gap { background: var(--amber-soft); color: var(--amber); text-decoration: none; font-weight: 600; }
.opp { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.opp.first { border-left: 4px solid var(--blue); }
.opp .oh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-weight: 650; }
.opp ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
.report { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.report .rh { background: var(--navy); color: #fff; padding: 10px 14px; font-weight: 650; }
.report .rh span { display: block; font-weight: 400; font-size: 12px; opacity: .8; }
.report .rb { padding: 12px 14px; }
.report .big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.report .big3 div { background: var(--blue-soft); border-radius: 6px; padding: 8px 10px; }
.report .big3 b { display: block; font-size: 20px; }
.report .big3 span { font-size: 11.5px; color: #075a99; }
.nextstep { background: var(--amber-soft); border-radius: 6px; padding: 8px 10px; }
.wa .msg.frank { background: #e7f6e9; }
.doc { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.doc h3 { margin: 0 0 2px; }
.doc h4 { margin-top: 14px; }
.twobar { display: grid; grid-template-columns: 110px 1fr 70px; gap: 6px 10px; align-items: center; font-size: 12.5px; margin-top: 6px; }
.twobar .b { height: 14px; border-radius: 3px; background: var(--navy); }
.twobar .b.pot { background: var(--blue); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } }

/* ---- Product polish layer (ui-ux-pro-max pass): type, app bar, labels, states ---- */
body { font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
.top { background: var(--navy); color: #fff; border-bottom: 0; padding: 10px 20px; gap: 18px; }
.brand { color: #fff; text-decoration: none; font-size: 21px; letter-spacing: .01em; padding-right: 18px; border-right: 1px solid rgb(255 255 255 / .16); }
.brand span { color: var(--blue); }
.title h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: #fff; }
.title p { color: rgb(255 255 255 / .68); font-size: 12.5px; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top .pill.amber { background: rgb(251 239 213 / .14); color: #f5cf86; }
.top .ghost { color: #fff; border-color: rgb(255 255 255 / .3); }
.top .ghost:hover { background: #fff; color: var(--navy); border-color: #fff; }
.top .primary { background: var(--blue); }
.top .primary:hover { background: #0a6fbb; }
button, .primary, .ghost, .tabs button, .filters button, .quick button, tr.row { transition: background-color .15s, color .15s, border-color .15s, box-shadow .15s, opacity .2s; }
.primary, .ghost { min-height: 38px; border-radius: 8px; }
button:focus-visible, a:focus-visible, input:focus-visible, tr.row:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.funnel { gap: 8px; padding: 14px 20px; }
.stage { border-radius: 10px; padding: 10px 12px; box-shadow: 0 1px 2px rgb(21 21 58 / .04); }
.stage .who { font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600; }
.stage .n { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.stage .what { font-size: 12px; }
.divider { font-size: 11px; letter-spacing: .02em; text-transform: none; }
.panel { border-radius: 12px; box-shadow: 0 1px 2px rgb(21 21 58 / .04), 0 8px 24px -12px rgb(21 21 58 / .12); }
.tabs button { padding: 12px 12px; }
.tabs button:hover { color: var(--navy); }
th { font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600; }
td { padding: 9px 10px; }
td:first-child { white-space: nowrap; font-weight: 600; }
td:first-child .sub { font-weight: 400; }
td .sub { font-size: 12px; }
.filters button { font-size: 12.5px; padding: 5px 12px; }
.filters button:hover { border-color: var(--navy); color: var(--navy); }
.filters button.on:hover { color: #fff; }
h4 { font-size: 12.5px; letter-spacing: 0; text-transform: none; font-weight: 700; color: var(--navy); }
.kpi { border-radius: 8px; padding: 10px 12px; }
.kpi b { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.kpi span, .sparklabels, .spark .limit span { font-size: 12px; }
.pill { font-size: 12px; }
.opp, .card, .doc, .report { border-radius: 10px; }
.dhead h2 { font-size: 20px; letter-spacing: -.015em; }
.empty { font-size: 15px; }
/* Schibsted's tabular figures space out commas; proportional figures read cleanly */
*, *::before, *::after { font-variant-numeric: proportional-nums !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---- Dark product theme: deep navy canvas, glowing blue and cyan data ---- */
:root {
  --bg: #0a0b22; --card: #121338; --card-2: #191b47; --text: #e9ecf7; --muted: #9ba4c0; --line: #252957;
  --navy: #e9ecf7; --blue: #3b9eff; --cyan: #34d6ff; --blue-soft: rgb(59 158 255 / .15);
  --green: #4ade80; --green-soft: rgb(74 222 128 / .13); --amber: #fbbf5a; --amber-soft: rgb(251 191 90 / .13);
  --red: #ff7b72; --red-soft: rgb(255 123 114 / .13); --grey-soft: rgb(255 255 255 / .06);
  color-scheme: dark;
}
body {
  background:
    radial-gradient(900px 420px at 12% -8%, rgb(59 158 255 / .16), transparent 60%),
    radial-gradient(800px 380px at 92% -10%, rgb(52 214 255 / .10), transparent 60%),
    var(--bg);
}
.top { background: rgb(10 11 34 / .7); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
.brand { color: var(--text); border-right-color: var(--line); }
.top .primary, .primary { background: linear-gradient(135deg, #3b9eff, #2b7de0); color: #fff; box-shadow: 0 6px 20px -6px rgb(59 158 255 / .7); }
.top .primary:hover, .primary:hover { background: linear-gradient(135deg, #5aaeff, #3b8cf0); }
.top .ghost, .ghost { color: var(--text); border-color: var(--line); background: rgb(255 255 255 / .03); }
.top .ghost:hover, .ghost:hover { background: rgb(255 255 255 / .08); color: #fff; border-color: #3a3f7a; }
.top .pill.amber { background: var(--amber-soft); color: var(--amber); }
.stage, .panel, .card, .opp, .doc, .report, .email, .block {
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .04), 0 12px 32px -18px rgb(0 0 0 / .8);
}
.stage { border-top: 2px solid var(--line); }
.stage.done, .stage.active { border-top-color: var(--cyan); }
.stage.active { box-shadow: 0 0 0 1px var(--cyan), 0 0 28px -6px rgb(52 214 255 / .55); }
.stage.sim.done { border-top-color: var(--green); }
.stage .who { color: var(--cyan); }
.stage.sim .who { color: var(--green); }
.stage .n { color: #fff; }
.tabs { border-bottom-color: var(--line); }
.tabs button.on { color: #fff; border-bottom-color: var(--cyan); }
.tabs button:hover { color: #fff; }
th { background: var(--card); color: var(--muted); border-bottom-color: var(--line); }
td { border-bottom-color: rgb(255 255 255 / .05); }
tr.row:hover { background: rgb(255 255 255 / .03); }
tr.row.sel { background: var(--blue-soft); box-shadow: inset 2px 0 0 var(--cyan); }
.log div, ul.plain li { border-bottom-color: rgb(255 255 255 / .06); }
.log b { color: var(--cyan); }
.kpi, .eco-out div, .email .hd, .quotefrom, .msg.frank { background: var(--card-2); border: 1px solid var(--line); }
.kpi b, .dhead h2, .big, .report .big3 b, .card h3 { color: #fff; }
.eco-out .agent { background: var(--blue-soft); }
.eco input, .row2 input[type=number], .inputrow input { background: var(--card-2); color: var(--text); border-color: var(--line); }
.filters button, .quick button { background: transparent; color: var(--muted); border-color: var(--line); }
.filters button:hover, .quick button:hover { color: #fff; border-color: #3a3f7a; background: rgb(255 255 255 / .05); }
.filters button.on, .filters button.on:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.quick button { color: var(--blue); border-color: rgb(59 158 255 / .5); }
.quick button.go { background: var(--blue); color: #fff; }
.replybar { background: linear-gradient(transparent, var(--card) 18%); }
.msg.prospect { background: var(--blue); color: #fff; }
.wa .msg.frank { background: var(--green-soft); }
.pill.blue { color: #8cc8ff; }
.pill.navy { background: var(--blue); color: #fff; }
.report .rh { background: linear-gradient(135deg, #1d3f8f, #14205a); }
.report .big3 div { background: var(--blue-soft); }
.report .big3 span { color: #8cc8ff; }
.bar { background: rgb(255 255 255 / .08); }
.bar i { background: linear-gradient(90deg, var(--blue), var(--cyan)); box-shadow: 0 0 10px rgb(52 214 255 / .5); }
.spark { border-bottom-color: var(--line); }
.spark .col i { background: linear-gradient(180deg, var(--cyan), var(--blue) 70%, rgb(59 158 255 / .55)); box-shadow: 0 0 18px -4px rgb(52 214 255 / .55); }

.twobar .b { background: rgb(255 255 255 / .25); }
.twobar .b.pot { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.feat span.off { color: var(--muted); }
h4 { color: var(--text); }
.empty { color: var(--muted); }
a { color: #8cc8ff; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #2a2e63; border-radius: 10px; border: 2px solid var(--card); } ::-webkit-scrollbar-track { background: transparent; }

/* ---- One product: switch between the Engine and the Radar ---- */
.appnav { display: flex; gap: 4px; padding: 4px; border: 1px solid #252957; border-radius: 10px; background: rgb(255 255 255 / .03); }
.appnav a { padding: 6px 12px; border-radius: 7px; color: #9ba4c0; font-weight: 600; font-size: 13.5px; text-decoration: none; white-space: nowrap; transition: background-color .15s, color .15s; }
.appnav a:hover { color: #fff; background: rgb(255 255 255 / .06); }
.appnav a[aria-current="page"] { color: #fff; background: linear-gradient(135deg, #3b9eff, #2b7de0); box-shadow: 0 4px 14px -4px rgb(59 158 255 / .7); }
html { background: #0a0b22; } body { min-height: 100vh; background-attachment: fixed !important; }

/* ---- Guide bar: the four steps of the demo, always one click away ---- */
.guide { display: flex; align-items: center; gap: 14px; margin: 14px 20px 0; padding: 10px 12px 10px 16px; border: 1px solid #252957; border-radius: 12px; background: linear-gradient(90deg, rgb(59 158 255 / .12), rgb(52 214 255 / .04)); }
.guide-hint { flex: 1; min-width: 0; color: #e9ecf7; font-size: 14px; }
.guide-hint b { color: #fff; }
.guide-steps { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; }
.guide-steps button { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px 0 6px; border: 1px solid #252957; border-radius: 999px; background: rgb(255 255 255 / .03); color: #9ba4c0; font-weight: 600; font-size: 13px; white-space: nowrap; transition: background-color .15s, color .15s, border-color .15s, box-shadow .2s; }
.guide-steps button:hover { color: #fff; border-color: #3a3f7a; }
.guide-steps i { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #252957; color: #fff; font-style: normal; font-size: 12px; }
.guide-steps .done { color: #e9ecf7; }
.guide-steps .done i { background: #4ade80; color: #0a0b22; }
.guide-steps .now { color: #fff; border-color: #3b9eff; box-shadow: 0 0 0 3px rgb(59 158 255 / .2); }
.guide-steps .now i { background: #3b9eff; }
.guide-close { border: 0; background: none; color: #9ba4c0; font-size: 20px; line-height: 1; padding: 4px 6px; }
.guide-close:hover { color: #fff; }
.guide-open { display: none; }
.guide-hidden .guide { display: none; }
.guide-hidden .guide-open { display: inline-flex; }
.stage { cursor: help; }
@media (max-width: 1100px) { .guide { flex-wrap: wrap; } .guide-steps { flex-wrap: wrap; } }

/* ---- Empty states, tab hints, tighter table rows, small screens ---- */
.empty { display: grid; place-items: center; min-height: 100%; padding: 32px 24px; }
.right > .empty { flex: 1; }
.es { max-width: 340px; text-align: center; }
.es-ic { display: grid; place-items: center; width: 40px; height: 40px; margin: 0 auto 14px; border-radius: 50%; border: 1px solid rgb(52 214 255 / .45); background: rgb(52 214 255 / .08); color: #34d6ff; font-weight: 700; font-size: 16px; }
.es h3 { margin: 0 0 6px; color: #fff; font-size: 18px; letter-spacing: -.01em; }
.es p { margin: 0 0 18px; color: var(--muted); font-size: 14.5px; line-height: 1.5; }
.es-btn { min-height: 44px; padding: 0 22px; font-size: 15px; }
.tabhint { flex: none; margin: 0; padding: 9px 18px; color: var(--muted); font-size: 13px; line-height: 1.4; border-bottom: 1px solid rgb(255 255 255 / .05); }
.clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; line-height: 1.35; }
.divider { color: #4ade80; cursor: help; }
#lbody > table th:nth-child(3) { width: 30%; }
#lbody > table .clamp2 { font-size: 13.5px; }
#lbody > table td, #lbody > table th { padding-left: 8px; padding-right: 8px; }
#lbody > table td:first-child, #lbody > table th:first-child { padding-left: 14px; }
@media (min-width: 1101px) { main { grid-template-columns: minmax(380px, 46%) 1fr; } }
#lbody > table td:nth-child(2) .sub { white-space: nowrap; }
html, body { max-width: 100%; overflow-x: hidden; }
@media (max-width: 720px) {
  .top { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
  .top .title { display: none; }
  .actions { flex-wrap: wrap; margin-left: auto; }
  .guide { margin: 10px 14px 0; gap: 10px; }
  .guide-hint { flex: 1 1 100%; order: -1; padding-right: 28px; }
  .guide { position: relative; } .guide-close { position: absolute; top: 4px; right: 4px; }
  .funnel { padding: 10px 14px; gap: 6px; } .stage { flex: 1 1 44%; }
  main { padding: 0 14px 14px; grid-template-columns: minmax(0, 1fr); }
  .panel { min-width: 0; }
  .panel .body { overflow-x: auto; }
  #lbody > table th:nth-child(2), #lbody > table td:nth-child(2) { display: none; }
  .tabs { overflow-x: auto; } .tabs button { white-space: nowrap; }
}

/* ---- One app: the Radar opens inside the Engine, in the same page ---- */
#radarView { display: none; flex: 1; width: 100%; min-height: 0; border: 0; background: #0a0b22; }
.view-radar #radarView { display: block; }
.view-radar .guide, .view-radar #funnel, .view-radar main, .view-radar .title, .view-radar .actions { display: none !important; }
.maplink { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border: 1px solid rgb(59 158 255 / .5); border-radius: 999px; background: rgb(59 158 255 / .1); color: #8cc8ff; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background-color .15s, color .15s; }
.maplink:hover { background: #3b9eff; color: #fff; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" title="Back to the product page">FRANK<span>.</span></a>
  <nav class="appnav" aria-label="App"><a href="/demo" aria-current="page">Expansion Engine</a><a href="/radar">Radar</a></nav>
  <div class="title">
    <h1 class="sr-only">Expansion Engine</h1>
    <p>150 paying clients, generated to match FRANK's brief. Client replies are simulated live.</p>
  </div>
  <div class="actions">
    <button class="ghost guide-open" id="guideOpen">How it works</button>
    <span class="pill amber">synthetic data</span>
    <button id="skip" class="ghost">Show results</button>
    <button id="run" class="primary">Run the engine</button>
  </div>
</header>
<section id="funnel" class="funnel"></section>
<main>
  <section class="panel left">
    <nav class="tabs" id="ltabs">
      <button data-t="clients" class="on" title="Every client, scored on how they use FRANK">Usage Radar</button>
      <button data-t="log" title="What each agent did during the run, step by step">Agent log</button>
      <button data-t="insights" title="Totals across the client base and the pricing calculator">Insights</button>
    </nav>
    <div class="body" id="lbody"></div>
  </section>
  <section class="panel right">
    <div id="detail" class="empty"><div class="es"><div class="es-ic" aria-hidden="true">2</div><h3>Then open one account</h3><p>You will see its usage signals, its value report and the nudge that turns it into a signed upgrade.</p><button type="button" class="ghost es-btn" onclick="document.getElementById('skip').click()">Skip to the results</button></div></div>
  </section>
</main>
<script>
// Expansion Engine logic in the browser: the same rules as agents/account_agents.py
// (signal detector, sizer, playbook, router, value report), run on the compact client base.
// Output is checked to be identical to web/data.json by agents/verify_engine.js.
function buildData(RAW) {
  const MONTHS = ["Jun", "Jul", "Aug", "Sep", "Oct", "Nov"];
  const PLANS = { Trial: [39, 100, 0.40], Start: [99, 300, 0.35], Grow: [299, 1500, 0.25], Plus: [499, 3000, 0.20] };
  const ORDER = ["Trial", "Start", "Grow", "Plus"];
  const FEATURES = ["Quotes", "Renewals", "Claims", "WhatsApp", "Email", "Documents", "ERP link"];
  const OFFICE = 400, ERP_MOD = 70, CLAIMS_MOD = 60;
  const rnd = x => { const f = Math.floor(x); return Math.abs(x - f - 0.5) < 1e-9 ? f + (f % 2) : Math.round(x); }; // round half to even, like Python
  const n = x => x.toLocaleString("en-US"), eur = x => "€" + n(rnd(x));
  const pct0 = x => rnd(x * 100) + "%", spct = x => (x >= 0 ? "+" : "") + pct0(x);
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length, sum = a => a.reduce((x, y) => x + y, 0);
  const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const single = f => f.toLowerCase().replace(/s+$/, "");

  const cs = RAW.map(r => {
    const large = r[0][0] === "L";
    const feats = Object.fromEntries(FEATURES.map((f, i) => [f, !!(r[large ? 6 : 7] >> i & 1)]));
    const cap = large ? [r[7], r[8]] : [r[9], r[10]], captured = {};
    if (cap[0] != null) captured.Renewals = cap[0];
    if (cap[1] != null) captured.Claims = cap[1];
    if (large) {
      const list = r[9].map((o, j) => ({ town: o[0], live: j < r[2], users: o[1], est_steps: o[2] }));
      const erp = feats["ERP link"], claims = feats.Claims;
      return { id: r[0], name: "Broker group " + r[0], town: r[1], profile: "large", plan: "Enterprise",
        price: r[2] * (OFFICE + (erp ? ERP_MOD : 0) + (claims ? CLAIMS_MOD : 0)), limit: null, rate: null, offices: list.length,
        offices_live: r[2], office_list: list, seats: r[3], active: r[4], steps: r[5], erp, claims, features: feats, last_login: 0, captured };
    }
    const [price, limit, rate] = PLANS[r[2]];
    return { id: r[0], name: "Agency " + r[0], town: r[1], profile: "agency", plan: r[2], price, limit, rate, offices: r[3],
      seats: r[4], active: r[5], steps: r[6], features: feats, last_login: r[8], captured };
  });
  for (const c of cs) {
    const peers = cs.filter(x => x.plan === c.plan && x !== c);
    c.peers = Object.fromEntries(FEATURES.map(f => [f, rnd(100 * peers.filter(x => x.features[f]).length / Math.max(1, peers.length))]));
    c.peer_steps = peers.length ? rnd(median(peers.map(x => x.steps[5]))) : null;
  }

  function detect(c) {
    const s = c.steps, opps = [], last2 = mean(s.slice(-2)), first2 = mean(s.slice(0, 2)), trend = last2 / first2 - 1;
    c.trend = rnd(trend * 100) / 100;
    if (c.profile === "large") {
      const N = c.offices, live = c.offices_live, per = OFFICE + (c.erp ? ERP_MOD : 0) + (c.claims ? CLAIMS_MOD : 0);
      opps.push({ type: "rollout", title: `Roll out to the ${N - live} offices not yet on FRANK`, kind: "revenue", value: (N - live) * per * 12, route: "human",
        evidence: [`${live} of ${N} offices are live`, `Live offices run ${n(rnd(s[5] / live))} steps a month each`, `Usage in live offices changed ${spct(trend)} in six months`] });
      if (!c.erp) opps.push({ type: "module", title: "Add the ERP integration", kind: "revenue", value: N * ERP_MOD * 12, route: "human",
        evidence: ["Has its own ERP, but data is still moved by CSV", "ERP link is the feature large accounts buy next (FRANK brief)"] });
      if (!c.claims) opps.push({ type: "module", title: "Add claims handling", kind: "revenue", value: N * CLAIMS_MOD * 12, route: "human",
        evidence: ["Uses quotes and renewals only", "No claims opened through FRANK in six months"] });
      if (c.active / c.seats < .7) opps.push({ type: "seats", title: `Activate the ${c.seats - c.active} users who are not using FRANK`, kind: "adoption", value: 0, route: "auto",
        evidence: [`${c.active} of ${c.seats} users active in the last 30 days`] });
      return opps;
    }
    const { price, limit, rate, plan } = c, pct = last2 / limit, over = Math.max(0, last2 - limit) * rate;
    const churn = trend <= -.3 || c.last_login >= 21;
    if (churn) opps.push({ type: "churn", title: "Usage is falling: check in before they cancel", kind: "risk", value: price * 12, route: plan === "Plus" ? "human" : "auto",
      evidence: [`Steps changed ${spct(trend)} in six months`, `Last login ${c.last_login} days ago`, `${c.active} of ${c.seats} users active`] });
    if (plan === "Trial" && s[5] >= 60 && !churn) {
      opps.push({ type: "upgrade", to: "Start", title: "Convert from Trial to Start", kind: "revenue", value: (99 - 39) * 12, route: "auto",
        evidence: [`Used ${s[5]} of 100 trial tasks in November`, "Usage is steady or growing"] });
    } else if ((plan === "Start" || plan === "Grow") && pct >= .85 && trend > -.05) {
      const nxt = ORDER[ORDER.indexOf(plan) + 1], np = PLANS[nxt][0], net = (np - price - over) * 12;
      const ev = [`Average of the last two months: ${n(rnd(last2))} steps, ${pct0(pct)} of the ${n(limit)} included`, `Usage changed ${spct(trend)} in six months`];
      if (over) ev.push(`Paying about ${eur(over)} a month in extra steps`);
      if (net > 0) opps.push({ type: "upgrade", to: nxt, title: `Upgrade from ${plan} to ${nxt}`, kind: "revenue", value: rnd(net), route: "auto", evidence: ev, over: rnd(over) });
      else opps.push({ type: "fairprice", to: nxt, title: `Move to ${nxt}: the client would pay less`, kind: "adoption", value: 0, route: "auto",
        evidence: [...ev, `${nxt} would cost them ${eur(-net / 12)} less a month: offer it before they notice`], over: rnd(over) });
    } else if (plan === "Plus" && pct >= .85 && trend > -.05) {
      opps.push({ type: "custom", title: "Outgrowing Plus: offer a custom plan", kind: "revenue", value: rnd(price * 12 * .25), route: "human",
        evidence: [`${pct0(pct)} of the Plus limit used`, "Value is an estimate: 25% uplift on current billing"] });
    }
    if (!churn && plan !== "Trial") {
      for (const [f, share] of [["Renewals", .4], ["WhatsApp", .2], ["Claims", .25]]) {
        if (c.features[f]) continue;
        const added = s[5] * share, extra = Math.max(0, s[5] + added - limit) * rate * 12;
        opps.push({ type: "feature", feature: f, title: `Turn on ${f}`, kind: extra > 50 ? "revenue" : "adoption", value: extra > 50 ? rnd(extra) : 0, route: "auto",
          evidence: [f in c.captured ? `FRANK captured ${c.captured[f]} ${single(f)} requests in the inbox in November; the team did them by hand` : "Clients write by WhatsApp, but the channel is not connected",
            `${c.peers[f]}% of agencies on ${plan} run ${f} through FRANK. This one runs zero`, `Agencies that add ${f} run about ${pct0(share)} more steps (assumption)`,
            extra <= 50 ? "Brings the next plan upgrade forward" : `Would take them over the ${n(limit)} included steps`] });
        break;
      }
      if (c.seats >= 2 && c.active / c.seats < .5) opps.push({ type: "seats", title: `Activate the ${c.seats - c.active} colleagues who are not using FRANK`, kind: "adoption", value: 0, route: "auto",
        evidence: [`${c.active} of ${c.seats} users active in the last 30 days`] });
    }
    return opps;
  }

  function message(c, o) {
    const s = c.steps, t = o.type, W = "WhatsApp to the owner";
    if (t === "upgrade" && c.plan === "Trial") return { channel: W, text: `Hello from FRANK. You used ${s[5]} of your 100 trial tasks in November, so the trial is nearly used up. Start gives you 300 steps a month for €99, with no long-term contract. Switch with one tap and nothing is interrupted.`, buttons: ["Switch to Start", "Show me the numbers", "Not now"] };
    if (t === "upgrade" || t === "fairprice") {
      const [np, nl] = PLANS[o.to], over = o.over ? ` Last month you paid about ${eur(o.over)} for extra steps.` : "";
      const tail = t === "fairprice" ? `On ${o.to} your bill would be lower than it is today.` : `${o.to} includes ${n(nl)} steps for €${np} a month, so you have room for ${(rnd(nl / s[5] * 10) / 10).toFixed(1)}x today's volume.`;
      return { channel: W, text: `Hello from FRANK. Your team ran ${n(s[4])} steps in October and ${n(s[5])} in November. ${c.plan} includes ${n(c.limit)}.${over} ${tail} Switch from 1 December? One tap, and I send the contract amendment for e-signature.`, buttons: [`Switch to ${o.to}`, "Show me the numbers", "Not now"] };
    }
    if (t === "feature") {
      const f = o.feature, how = { Renewals: "FRANK can prepare each renewal 30 days ahead: it collects the details, checks the market and hands you a comparison to approve.",
        WhatsApp: "Your clients can send requests by WhatsApp and FRANK picks them up, the same way it does with email.",
        Claims: "FRANK can open the claim with the insurer, chase the documents and keep your client informed until it closes." }[f];
      const seen = f in c.captured ? `I saw ${c.captured[f]} ${single(f)} requests in your inbox in November, and your team did them by hand. ` : "Your clients write to you on WhatsApp, but I only see your email. ";
      return { channel: W, trial: true, text: `Hello from FRANK. ${seen}${c.peers[f]}% of agencies your size run ${f} through FRANK. ${how} Try it free for 14 days with one tap. After that it stays on and its steps count towards your plan, unless you tell me to stop. I will remind you on day 12.`, buttons: [`Start 14-day trial of ${f}`, "Show me how it works", "Not now"] };
    }
    if (t === "seats") return { channel: W, text: `Hello from FRANK. ${c.active} of your ${c.seats} colleagues used FRANK in the last 30 days. Shall I send the others a five-minute start guide with three tasks to try?`, buttons: ["Send the guide", "Not now"] };
    if (t === "churn") return { channel: W, text: `Hello from FRANK. Your team ran ${n(s[5])} steps in November, down from ${n(s[0])} in June. Is something not working for you? Tell me what got in the way, or pick a time and a person from our team will call you.`, buttons: ["Book a call", "It is fine, just a quiet month", "I want to cancel"] };
    return null;
  }

  function accountPlan(c, opps) {
    const nxt = c.office_list.filter(o => !o.live).sort((a, b) => b.est_steps - a.est_steps).slice(0, 3), pl = c.offices_live > 1 ? "s" : "";
    return {
      situation: [`${c.offices_live} of ${c.offices} offices live, ${c.active} active users of ${c.seats} licensed`, `${n(c.steps[5])} steps in November (${spct(c.trend)} in six months)`,
        `Billing today: ${eur(c.price * 12)} a year. Modules: quotes and renewals` + (c.erp ? ", ERP link" : "") + (c.claims ? ", claims" : "")],
      opportunities: opps.filter(o => o.kind === "revenue").map(o => ({ title: o.title, value: o.value })),
      sequence: nxt.map(o => `${o.town} office: ${o.users} users, about ${n(o.est_steps)} steps a month expected`),
      stakeholders: ["Managing partner (sponsor): the business case", "Operations director: rollout order and training",
        c.erp ? "IT lead: already integrated, confirm capacity" : "IT lead: ERP integration", c.claims ? "Office managers of the next three offices" : "Claims manager: claims pilot"],
      email: `Subject: Results from your ${c.offices_live} live office${pl} and a proposal for the next three\n\nYour ${c.offices_live} live office${pl} ran ${n(c.steps[5])} steps through FRANK in November, ${spct(c.trend)} against June. Based on those numbers I have prepared a rollout plan for ${nxt.map(o => o.town).join(", ")}, the three offices with the highest expected volume, and a business case for the whole group.\n\nCould we take 30 minutes next week to go through it? I have attached the one-page plan.`,
    };
  }

  const rank = { revenue: 0, risk: 1, adoption: 2 };
  for (const c of cs) {
    const opps = detect(c);
    for (const o of opps) o.message = message(c, o);
    opps.sort((a, b) => rank[a.kind] - rank[b.kind] || b.value - a.value);
    if (opps.some(o => o.kind === "risk")) opps.sort((a, b) => (a.kind !== "risk") - (b.kind !== "risk"));
    c.opps = opps;
    c.route = c.profile === "large" || (opps[0] && opps[0].route === "human") ? "human" : "auto";
    c.potential = rnd(sum(opps.filter(o => o.kind === "revenue").map(o => o.value)));
    c.at_risk = sum(opps.filter(o => o.kind === "risk").map(o => o.value));
    c.billed = rnd(c.price * 12 + (c.limit ? Math.max(0, c.steps[5] - c.limit) * c.rate * 12 : 0));
    if (c.profile === "large") c.plan_doc = accountPlan(c, opps);
    const hours = rnd(c.active * 10 * 4.3 * (c.limit ? Math.min(1, c.steps[5] / c.limit) : .8));
    c.report = { hours, value: hours * 15, price: rnd(c.billed / 12), steps: c.steps[5], next: opps[0] ? opps[0].title : "Nothing to change: you are getting full value from your plan" };
    const used = FEATURES.filter(f => c.features[f]).length;
    c.health = Math.max(5, Math.min(100, 100 - (c.at_risk ? 35 : 0) - rnd((1 - c.active / c.seats) * 25) - (7 - used) * 3 - Math.min(15, Math.floor(c.last_login / 2))));
  }
  cs.sort((a, b) => (b.potential + b.at_risk) - (a.potential + a.at_risk) || (a.id < b.id ? -1 : 1));
  const all = cs.flatMap(c => c.opps), ag = cs.filter(c => c.profile === "agency"), lg = cs.filter(c => c.profile === "large"), tot = (a, k) => sum(a.map(c => c[k]));
  const labels = { upgrade: "Plan upgrade", fairprice: "Fair-price move", feature: "Feature activation", seats: "User activation", churn: "Churn save", rollout: "Office rollout", module: "Module add-on", custom: "Custom plan" };
  const stats = { clients: cs.length, agencies: ag.length, large: lg.length, steps_month: sum(cs.map(c => c.steps[5])), signals: all.length, clients_with_signal: cs.filter(c => c.opps.length).length,
    potential: tot(cs, "potential"), at_risk: tot(cs, "at_risk"), billed: tot(cs, "billed"), billed_agency: tot(ag, "billed"), potential_agency: tot(ag, "potential"),
    billed_large: tot(lg, "billed"), potential_large: tot(lg, "potential"), plays: all.filter(o => o.message).length + lg.length, reports: cs.length,
    captured: sum(cs.map(c => sum(Object.values(c.captured)))), hours: sum(cs.map(c => c.report.hours)),
    auto_clients: cs.filter(c => c.route === "auto" && c.opps.length).length, human_clients: cs.filter(c => c.route === "human" && c.opps.length).length, by_type: {} };

  }).join("");
}

async function countTo(k, target, ms = 700) {
  const t0 = performance.now();
  for (;;) {
    const f = Math.min(1, (performance.now() - t0) / ms);
    shown[k] = Math.round(target * (1 - Math.pow(1 - f, 3))); renderFunnel(k);
    if (f >= 1) break; await sleep(30);
  }
}

function log(who, text) { logLines.push({ who, text, t: new Date().toLocaleTimeString("en-GB") }); if (ltab === "log") renderLeft(); }

async function runEngine() {
  if (running) return;
  running = true; ran = false; logLines = []; sel = null;
  for (const k in shown) delete shown[k];
  for (const k in play) delete play[k];
  $("#run").disabled = true; ltab = "log"; renderTabs(); renderLeft(); renderFunnel();
  $("#detail").className = "empty"; $("#detail").style.cssText = ""; $("#detail").innerHTML = "The engine is working…";
  const t = S.by_type, n = k => t[k] ? t[k].n : 0;
  const script = [
    ["clients", S.clients, "Usage Radar", `Read six months of usage for ${S.clients} paying clients: steps, active users, features, offices, last login. ${fmt(S.steps_month)} steps ran in November.`],
    [null, 0, "Usage Radar", `Counted ${fmt(S.captured)} renewal and claim requests that FRANK saw in client inboxes last month but did not execute, because the flow is switched off. That is unserved demand.`],
    ["signals", S.signals, "Signal detector", `Compared each client with agencies on the same plan. ${S.signals} signals in ${S.clients_with_signal} accounts: ${n("Feature activation")} unused flows, ${n("Plan upgrade")} plan limits reached, ${n("Office rollout")} office rollouts, ${n("Module add-on")} module gaps, ${n("Churn save")} at risk of leaving.`],
    ["potential", S.potential, "Sizer", `Put a yearly value on each signal: ${eur(S.potential)} of expansion potential against ${eur(S.billed)} billed today. ${eur(S.at_risk)} of billing is at risk.`],
    ["reports", S.reports, "Value report agent", `Drafted ${S.reports} monthly value reports for agency owners: hours saved, euro value and one next step. ${fmt(S.hours)} hours of admin saved across the base in November (estimate).`],
    ["auto_clients", S.auto_clients, "Router", `${S.auto_clients} accounts get a zero-touch play: a nudge with a one-tap trial or upgrade. ${S.human_clients} accounts get a prepared plan for a person: all ${S.large} large brokers and the highest-value exceptions.`],
    [null, 0, "Orchestrator", "Nudges ready to send. People at FRANK involved so far: 0."],
  ];
  for (const [k, v, who, text] of script) { log(who, text); if (k) await countTo(k, v); else await sleep(650); await sleep(350); }
  finish();
}

function finish() {
  STAGES.filter(s => !s.sim).forEach(s => shown[s.k] = S[s.k]);
  ran = true; running = false; $("#run").disabled = false; $("#run").textContent = "Run again";
  ltab = "clients"; renderTabs(); renderFunnel();
  select((D.clients.find(c => ["Start", "Grow"].includes(c.plan) && c.opps[0]?.message?.trial && c.opps[0].value > 0 && c.captured.Renewals) || D.clients[0]).id);
}

  if (p?.win) return `<span class="pill green">Adopted</span>`;

function act(a) {
  const c = CUR(), o = topOpp(c), p = P(c), m = o.message;
  const you = t => p.msgs.push({ who: "prospect", text: t }), frank = t => p.msgs.push({ who: "frank", text: t }), sys = t => p.msgs.push({ who: "sys", text: t });
  p.answered = true;
  if (a === "b0") {
    you(m.buttons[0]);
    if (o.type === "feature") { p.state = "trial"; p.trial = true; frank(`Done. ${o.feature} is on from today, free for 14 days. I will pick up the next ${o.feature.toLowerCase().replace(/s$/, "")} request that reaches your inbox.`); sys("Trial started · day 0 of 14"); }
    else if (o.type === "upgrade" || o.type === "fairprice") { p.state = "amend"; p.msgs.push({ block: amendment(c, o) }); }
    else if (o.type === "seats") { p.state = "done"; p.win = true; frank(`Sent. ${c.seats - c.active} colleagues got the five-minute start guide with three tasks to try. I will tell you in two weeks who used it.`); sys("Adoption play completed · no person at FRANK involved"); }
    else if (o.type === "churn") { p.state = "handover"; frank("Thank you. A person from our team will call you, and they will have your usage history in front of them."); sys("Handed to a person with the full account history · this is the engine's exception path"); }
  } else if (a === "b1" && m.buttons.length === 3) {
    you(m.buttons[1]);
    if (o.type === "churn") { p.state = "done"; frank("Good to know. I will check again next month and leave you in peace until then."); sys("Logged: quiet month · recheck in 30 days"); }
    else if (o.type === "feature") frank(`Three steps. 1) A ${o.feature.toLowerCase().replace(/s$/, "")} request reaches your inbox or WhatsApp. 2) I read it, collect what is missing and work through the insurer portals. 3) You get the result to approve. Nothing reaches your client until you press send.`);
    else { const to = D.plans[o.to], over = Math.max(0, c.steps[5] - c.limit) * c.rate; frank(`September ${fmt(c.steps[3])}, October ${fmt(c.steps[4])}, November ${fmt(c.steps[5])} steps, against ${fmt(c.limit)} included. November cost you about €${fmt(c.price + over)} with extra steps. ${o.to} is €${to[0]} flat for up to ${fmt(to[1])} steps.`); }
  } else if (a === "b2" || (a === "b1" && m.buttons.length === 2) || a === "decline") {
    you(a === "decline" ? "Not now" : m.buttons[m.buttons.length - 1]);
    if (o.type === "churn") { p.state = "handover"; frank("I am sorry to hear that. Before anything changes, a person from our team will call you today."); sys("Escalated to a person immediately · cancel intent"); }
    else { p.state = "snoozed"; frank("No problem. I will not raise this again for 60 days."); sys("Snoozed for 60 days · reason logged for the learning loop"); }
  } else if (a === "day12") {
    const n = Math.max(3, Math.round((c.captured[o.feature] || c.steps[5] * .2) * 12 / 30));

  } else if (a === "keep") {
    you("Keep it on"); sys("Day 14 · trial converted");
    if (o.value > 0) { p.state = "amend"; p.msgs.push({ block: amendment(c, o) }); }
    else { p.state = "done"; p.win = true; frank(`${o.feature} stays on. It fits inside your ${c.plan} plan, so nothing changes on your bill.`); sys("Adoption win · brings the next plan upgrade forward"); }
  } else if (a === "stop") {
    you("Stop the trial"); p.state = "stopped"; frank(`Stopped. ${o.feature} is off and nothing was charged. What got in the way? One word is enough.`); sys("Opt-out honoured · reason requested for the learning loop");
  } else if (a === "sign") {
    p.state = "signed"; p.signed = o.value;

  }
  refresh();
}

  const d = c.plan_doc, p = P(c), total = d.opportunities.reduce((a, o) => a + o.value, 0);
  return `<div class="simnote">Augment, not automate: the engine prepares the plan, the Engagement Lead decides. You play the Engagement Lead.</div>
    <div class="doc"><h3>Expansion plan · ${esc(c.name)}</h3><p class="muted">Prepared by the engine from usage data · ${eur(c.billed)} billed today, ${eur(total)} identified</p>
      <div class="cols"><div><h4>Situation</h4><ul class="plain">${d.situation.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        <h4>Opportunities</h4><table><tbody>${d.opportunities.map(o => `<tr><td>${esc(o.title)}</td><td class="num">+${eur(o.value)}</td></tr>`).join("")}<tr><td><b>Total a year</b></td><td class="num"><b>+${eur(total)}</b></td></tr></tbody></table></div>
      <div><h4>Suggested rollout order</h4><ul class="plain">${d.sequence.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        <h4>Who to involve</h4><ul class="plain">${d.stakeholders.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
      <h4>Draft email to the sponsor</h4><div class="quotefrom">${esc(d.email)}</div>
      ${p.pipeline ? `<div class="block success" style="margin-top:12px"><h3>Approved and sent by the Engagement Lead</h3><p>+${eur(total)} a year in the pipeline. Time spent by the lead: one review instead of a day of preparation.</p></div>`
        : `<div class="row2"><button class="primary" data-act="approve">Approve and send (Engagement Lead)</button></div>`}</div>`;
}

function approve() {
  const c = CUR(), p = P(c);
  p.answered = true; p.pipeline = c.profile === "large" ? c.plan_doc.opportunities.reduce((a, o) => a + o.value, 0) : topOpp(c).value;
  refresh();
}

function refresh() { renderDetail(false); renderFunnel(); renderLeft(); }

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#ltabs button")) { ltab = t.dataset.t; renderTabs(); renderLeft(); }
  else if (t.closest("#dtabs button")) { dtab = t.dataset.t; renderDetail(); }
  else if (t.dataset.f) { filter = t.dataset.f; renderLeft(); }
  else if (t.closest("tr.row")) select(t.closest("tr.row").dataset.n);
  else if (t.dataset.act === "approve") approve();
  else if (t.dataset.act) act(t.dataset.act);
});
$("#run").onclick = runEngine;
$("#skip").onclick = () => { if (!running) { logLines = []; finish(); } };

(async () => {
  D = window.EMBED ? window.EMBED.data : await (await fetch("data.json")).json(); S = D.stats;
  renderFunnel(); renderLeft();
})();

</script>

<script>
/* Guide bar: shows the next step of the demo and does it on click. Reads the app's own DOM, changes no engine logic. */
(() => {
  const steps = [
    { label: "Run the engine", hint: "<b>Step 1.</b> Press <b>Run the engine</b>. It scores all 150 clients and finds where each one is ready to grow." },
    { label: "Pick an account", hint: "<b>Step 2.</b> Click any account in the list to see its usage, its signals and what it is worth." },
    { label: "Play the client", hint: "<b>Step 3.</b> Open <b>tab 3</b>. You play the client: answer FRANK's message and accept the trial." },
    { label: "See it signed", hint: "<b>Step 4.</b> Reply to the nudge until the upgrade is signed. Watch <b>Signed</b> in the top row fill up." },
  ];
  const bar = document.createElement("div");
  bar.className = "guide";
  bar.setAttribute("role", "region");
  bar.setAttribute("aria-label", "How to use the demo");
  bar.innerHTML = `<p class="guide-hint" aria-live="polite"></p>
    <ol class="guide-steps">${steps.map((s, i) => `<li><button type="button" data-step="${i}"><i>${i + 1}</i>${s.label}</button></li>`).join("")}</ol>
    <button class="guide-close" type="button" aria-label="Hide the guide">×</button>`;
  document.querySelector("header.top").after(bar);

  let picked = false, played = false;
  document.addEventListener("click", e => {
    if (e.isTrusted && e.target.closest("tr.row")) picked = true;
    if (e.target.closest('#dtabs button[data-t="play"]')) played = true;
  }, true);

  const ran = () => !!document.querySelector("#lbody tr.row");
  const signed = () => [...document.querySelectorAll("#funnel .stage")].some(st => /Signed/.test(st.textContent) && /[1-9]/.test(st.querySelector(".n")?.textContent || ""));
  const state = () => [ran(), ran() && picked, ran() && played, signed()];

  function render() {
    const done = state();
    const now = done.findIndex(d => !d);
    // Write only what changed, so the page observer below never loops
    const key = done.join() + now;
    if (bar.dataset.key === key) return;
    bar.dataset.key = key;
    bar.querySelector(".guide-hint").innerHTML = now === -1
      ? "<b>Done.</b> That upgrade went from a usage signal to a signature with nobody at FRANK involved. Pick another account, or open the <b>Radar</b>."
      : steps[now].hint;
    bar.querySelectorAll(".guide-steps button").forEach((b, i) => {
      b.classList.toggle("done", done[i]);
      b.classList.toggle("now", i === now);
      b.querySelector("i").textContent = done[i] ? "✓" : i + 1;
    });
  }

  bar.addEventListener("click", e => {
    if (e.target.closest(".guide-close")) { document.body.classList.add("guide-hidden"); return; }
    const b = e.target.closest("[data-step]");
    if (!b) return;
    const n = +b.dataset.step;
    if (n === 0 || !ran()) { document.getElementById("skip")?.click(); return; }
    if (n === 1) { const rows = [...document.querySelectorAll("#lbody tr.row")];
      // Pick a zero-touch agency: its tab 3 is the live client conversation
      const r = rows.find(x => /Zero-touch/.test(x.textContent)) || rows[0]; picked = true; r?.click(); r?.scrollIntoView({ block: "nearest" }); }
    if (n >= 2) { played = true; document.querySelector('#dtabs button[data-t="play"]')?.click(); }
    render();
  });
  document.getElementById("guideOpen")?.addEventListener("click", () => document.body.classList.remove("guide-hidden"));

  // Plain-language explanation on every pipeline stage
  const explain = {
    "Usage Radar": "Scores every client on how they use FRANK, against agencies on the same plan.",
    "Signals": "Moments a client is ready to grow: a plan limit reached, a flow left off, users gone quiet.",
    "Euro value": "What each signal is worth a year, and how much revenue is at risk.",
    "Value reports": "A monthly report per client: hours saved, what that time is worth, one next step.",
    "Who acts": "Small agencies get an automatic nudge. Large brokers get a prepared plan for a person.",
    "Nudges": "Simulated: how many clients answered FRANK's message.",
    "Trials": "Simulated: one-tap 14-day trials started.",
    "Signed": "Simulated: upgrades signed with nobody at FRANK involved.",
  };
  const label = () => document.querySelectorAll("#funnel .stage").forEach(st => {
    const k = Object.keys(explain).find(k => (st.querySelector(".who")?.textContent || "").includes(k));
    if (k && st.title !== explain[k]) st.title = explain[k];
  });

  let queued = false;
  new MutationObserver(() => {
    if (queued) return;
    queued = true;
    setTimeout(() => { queued = false; render(); label(); }, 60);
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
  render(); label();
})();
</script>

<script>
/* One app: Engine and Radar in one page. The Radar loads in an iframe (?embed=1) and the two talk by postMessage. */
(() => {
  const body = document.body;
  const nav = document.querySelector(".appnav");
  const [engineTab, radarTab] = nav.querySelectorAll("a");
  const frame = document.createElement("iframe");
  frame.id = "radarView";
  frame.title = "Radar: every client on one map";
  document.querySelector("header.top").after(frame);
  let loaded = false, pendingTown = null;

  function setTab(radar) {
    body.classList.toggle("view-radar", radar);
    engineTab.toggleAttribute("aria-current", !radar); if (!radar) engineTab.setAttribute("aria-current", "page");
    radarTab.toggleAttribute("aria-current", radar); if (radar) radarTab.setAttribute("aria-current", "page");
  }
  function showRadar(town) {
    setTab(true);
    if (!frame.src) {
      frame.src = "/radar?embed=1" + (town ? "&town=" + encodeURIComponent(town) : "");
      frame.addEventListener("load", () => { loaded = true; if (pendingTown) { frame.contentWindow.postMessage({ type: "frank:showTown", town: pendingTown }, "*"); pendingTown = null; } }, { once: true });
    } else if (town) {
      if (loaded) frame.contentWindow.postMessage({ type: "frank:showTown", town }, "*"); else pendingTown = town;
    }
    history.replaceState(null, "", "#radar");
  }
  function showEngine() { setTab(false); history.replaceState(null, "", location.pathname + location.search); }

  // Open an account from a town: run the engine if needed, then select the best account there
  function openTown(town) {
    showEngine();
    const go = () => {
      const c = (D.clients || []).filter(c => c.town === town).sort((a, b) => (b.opps?.[0]?.value || 0) - (a.opps?.[0]?.value || 0))[0];
      if (c) { select(c.id); document.querySelector("#lbody tr.row.sel")?.scrollIntoView({ block: "center" }); }
    };
    if (!document.querySelector("#lbody tr.row")) { document.getElementById("skip")?.click(); setTimeout(go, 400); } else go();
  }

  engineTab.addEventListener("click", e => { e.preventDefault(); showEngine(); });
  radarTab.addEventListener("click", e => { e.preventDefault(); showRadar(); });
  window.addEventListener("message", e => { if (e.data?.type === "frank:openTown") openTown(e.data.town); });

  // "Show on map" on every account
  const addMapLink = () => {
    const meta = document.querySelector(".dhead .meta");
    if (!meta || meta.querySelector(".maplink")) return;
    const c = D?.clients?.find(x => x.id === sel);
    if (!c) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "maplink"; b.textContent = "Show " + c.town + " on the map";
    b.addEventListener("click", () => showRadar(c.town));
    meta.appendChild(b);
  };
  let q = false;
  new MutationObserver(() => { if (q) return; q = true; setTimeout(() => { q = false; addMapLink(); }, 60); })
    .observe(document.getElementById("dbody")?.parentElement || body, { childList: true, subtree: true });

  // Deep links: /demo?town=Lisboa opens that town's account, /demo#radar opens the map
  const town = new URLSearchParams(location.search).get("town");
  if (town) setTimeout(() => openTown(town), 300);
  else if (location.hash === "#radar") showRadar();
})();
</script>
